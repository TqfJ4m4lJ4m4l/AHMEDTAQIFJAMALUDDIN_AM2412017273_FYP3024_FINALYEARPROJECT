<main>
    <form class="account_Disp" id="accountForm">
        <div class="account-header">
            <div class="account-id-title">
                ACCOUNT ID:
            </div>
            <input
                type="text"
                id="accountID"
                name="accountID"
                value="ACC001"
                readonly
            >

            <button type="button" id="editButton">
                EDIT
            </button>

        </div>


        <div class="account-content">


            <div class="account-column">


                <div class="form-row">
                    <label for="name">NAME:</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        value="John Doe"
                        readonly
                    >
                </div>


                <div class="form-row">
                    <label for="birthDate">BIRTH DATE:</label>

                    <input
                        type="date"
                        id="birthDate"
                        name="birthDate"
                        value="2000-01-01"
                        readonly
                    >
                </div>


                <div class="form-row">
                    <label for="gender">GENDER:</label>

                    <select id="gender" name="gender" disabled>
                        <option value="MALE" selected>MALE</option>
                        <option value="FEMALE">FEMALE</option>
                    </select>
                </div>


                <div class="form-row">
                    <label for="role">ROLE:</label>

                    <input
                        type="text"
                        id="role"
                        name="role"
                        value="PATIENT"
                        readonly
                    >
                </div>


            </div>


            <div class="account-column">


                <div class="form-row">
                    <label for="email">EMAIL:</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        value="example@email.com"
                        readonly
                    >
                </div>


                <div class="form-row">
                    <label for="password">PASSWORD:</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        value="password123"
                        readonly
                    >
                </div>


                <div class="form-row password-request">

                    <label for="passwordRequest">
                        REQUEST PASSWORD<br>
                        CHANGE:
                    </label>

                    <select id="passwordRequest" name="passwordRequest" disabled>
                        <option value="NO" selected>NO</option>
                        <option value="YES">YES</option>
                    </select>

                </div>


                <div class="confirm-container">

                    <button type="submit" id="confirmButton">
                        CONFIRM
                    </button>

                </div>


            </div>


        </div>

    </form>

</main>

    <div class="footer-contact">

<script>

const editButton = document.getElementById("editButton");

const accountID = document.getElementById("accountID");
const name = document.getElementById("name");
const birthDate = document.getElementById("birthDate");
const gender = document.getElementById("gender");
const role = document.getElementById("role");
const email = document.getElementById("email");
const password = document.getElementById("password");
const passwordRequest = document.getElementById("passwordRequest");

const accountForm = document.getElementById("accountForm");


let editing = false;


editButton.addEventListener("click", function () {
once: true
    editing = !editing;

    if (editing) {

        accountID.readOnly = false;
        name.readOnly = false;
        birthDate.readOnly = false;
        role.readOnly = false;
        email.readOnly = false;
        password.readOnly = false;

        gender.disabled = false;
        passwordRequest.disabled = false;
        $('editButton').one('click', () => {
                  $('editButton').attr('disabled', 'disabled');
});

    } else {

        accountID.readOnly = true;
        name.readOnly = true;
        birthDate.readOnly = true;
        role.readOnly = true;
        email.readOnly = true;
        password.readOnly = true;

        gender.disabled = true;
        passwordRequest.disabled = true;

        editButton.textContent = "EDIT";

        editButton.classList.remove("save-mode");

        alert("Your information has been saved.");

    }

});


accountForm.addEventListener("submit", function (event) {

    event.preventDefault();

    if (!name.value ||
        !birthDate.value ||
        !gender.value ||
        !role.value ||
        !email.value ||
        !password.value) {

        alert("Please fill in all account information.");

        return;
    }

    alert("Account information confirmed.");

});

</script>

</body>

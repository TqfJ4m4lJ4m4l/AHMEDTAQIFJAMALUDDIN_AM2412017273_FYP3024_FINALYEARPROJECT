<main>

    <form class="book_Disp" id="accountForm" action="../php/booking.php" method="POST">

        <div class="book-header">

            <div class="booking-bigtext">
                BOOKING APPOINTMENT:
            </div>

            <input
                type="text"
                id="accountID"
                name="accountID"
                value="ACC001"
                readonly
            >

        </div>


        <div class="book-content">


            <!-- USER INFORMATION -->

            <div class="book-column">

                <div class="user_ID">

                    <div class="form-row">

                        <label for="userID">
                            ID:
                        </label>

                        <input
                            type="text"
                            id="userID"
                            name="userID"
                            placeholder="Enter your ID"
                            required
                        >

                    </div>

                </div>


                <div class="user_NameAndEmail">

                    <div class="form-row">

                        <label for="userName">
                            NAME:
                        </label>

                        <input
                            type="text"
                            id="userName"
                            name="userName"
                            placeholder="Enter your name"
                            required
                        >

                    </div>


                    <div class="form-row">

                        <label for="email">
                            EMAIL:
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>

                </div>


            </div>


            <!-- DOCTOR -->

            <div class="book-column">

                <div class="book_Doctor">

                    <div class="form-row">

                        <label for="doctor">
                            DOCTOR:
                        </label>

                        <select
                            id="doctor"
                            name="doctor"
                            required
                        >

                            <option value="">
                                Select Doctor
                            </option>

                            <option value="BrHd">
                                Dr. Bryan Hodukavich
                            </option>

                            <option value="AnAd">
                                Dr. Anna Adams
                            </option>

                        </select>

                    </div>

                </div>

            </div>


            <!-- DATE AND MEDIA -->

            <div class="book-column">

                <div class="book_DateAndMedia">

                    <div class="form-row">

                        <label for="bookingDate">
                            DATE:
                        </label>

                        <input
                            type="date"
                            id="bookingDate"
                            name="date"
                            required
                        >

                    </div>


                    <div class="form-row">

                        <label for="media">
                            MEDIA:
                        </label>

                        <select
                            id="media"
                            name="media"
                            required
                        >

                            <option value="">
                                Select Media
                            </option>

                            <option value="Physical">
                                Physical
                            </option>

                            <option value="Non-verbal">
                                Non-verbal
                            </option>

                            <option value="Digital">
                                Digital
                            </option>

                        </select>

                    </div>

                </div>

            </div>

            <div class="descBook">

                <div class="form-row">

                    <label for="descriptionBooking">

                    </label>

                    <textarea

                        name="description"
                        placeholder="Enter your booking description..."

                    ></textarea>

            </div>

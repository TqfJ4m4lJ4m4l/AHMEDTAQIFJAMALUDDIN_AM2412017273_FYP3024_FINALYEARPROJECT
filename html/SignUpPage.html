    <link rel="stylesheet" href="../styles/styleTheme.css">

    <style>
        .auth-toast[hidden] {
            display: none;
        }

        .auth-toast {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 16px;
            width: min(420px, calc(100vw - 48px));
            padding: 16px 18px;
            color: #702b32;
            background: #fff0f0;
            border: 1px solid #d98b94;
            border-left: 6px solid #b83b48;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
            font-size: 16px;
            line-height: 1.5;
        }

        .auth-toast-message {
            flex: 1;
        }

        .auth-toast-close {
            flex: 0 0 auto;
            padding: 2px 8px;
            color: inherit;
            background: transparent;
            border: 0;
            border-radius: 6px;
            font-size: 26px;
            line-height: 1;
            cursor: pointer;
        }

        .auth-toast-close:hover,
        .auth-toast-close:focus-visible {
            background: rgba(0, 0, 0, 0.08);
        }
    </style>
</head>

<body>

        <h1>
            <a href="HomePage.html">

            <nav>

                    <button
                        class="spef-dropdown-trigger"
                        type="button"

                        ABOUT US <span aria-hidden="true">▾</span>

                        <a href="AboutUs.html#our-team">Our Team</a>
                        <a href="AboutUs.html#psychiatric-faculty">Psychiatric Faculty</a>
                        <a href="AboutUs.html#why-this-department">Why This Department?</a>
                    </div>
                </div>

                <div class="neuro_button spef-dropdown">
                    <button
                        class="spef-dropdown-trigger"
                        type="button"
                        aria-expanded="false"
                        aria-controls="neuro-menu"
                    >
                        NEURODIVERGENCE <span aria-hidden="true">▾</span>

                    <div class="spef-dropdown-menu" id="neuro-menu">
                        <a href="Autism.html#what-is-neurodivergence">What is Neurodivergence?</a>

                        <a href="Autism.html#medication-and-support">Medication and Support</a>

                <div class="dropdown">

                        <a href="../php/account.php">
                            <img src="../img/login.png" alt="Account" width="70" height="70">

                    <div class="dropdown-content">
                        <a href="../php/account.php">Login</a>

                </div>
            </nav>

    </header>

    <main>
        <section>
            <div class="container">
                <div class="form-box active" id="signup-form">
                    <h3>Sign Up</h3>

                    <div
                        id="signup-message"
                        class="auth-toast"
                        role="alert"
                        aria-live="assertive"
                        hidden
                    >
                        <span class="auth-toast-message"></span>
                        <button
                            class="auth-toast-close"
                            type="button"
                            aria-label="Dismiss notification"
                        >&times;</button>
                    </div>

                    <form action="../php/signup.php" method="POST">
                        <input
                            type="text"
                            name="name"
                            placeholder="Username"
                            autocomplete="username"
                            required
                        >

                        <input
                            type="email"
                            name="email"
                            placeholder="Email"
                            autocomplete="email"
                            required
                        >

                        <input
                            type="date"
                            name="birthdate"
                            required
                        >

                        <label for="gender">Gender:</label>
                        <select name="gender" id="gender" required>
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>

                        <input
                            type="password"
                            name="password"
                            placeholder="Password"
                            autocomplete="new-password"
                            required
                        >

                        <input
                            type="password"
                            name="password2"
                            placeholder="Re-enter Password"
                            autocomplete="new-password"
                            required
                        >

                        <button type="submit" name="signup">Sign Up</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-contact">
            <p>CONTACT US AT:</p>

                (OFFICE HOURS: 8:30AM - 6:00PM)
            </p>
        </div>

        <div class="footer-version">
            <p>VERSION: 1.0.2</p>
        </div>

        <div class="footer-logo">
            <img src="../img/hctm.png" alt="HCTM Logo">
        </div>
    </footer>

    <script>
        document.querySelectorAll(".spef-dropdown-trigger").forEach((trigger) => {
            trigger.addEventListener("click", () => {
                const group = trigger.closest(".spef-dropdown");
                const willOpen = !group.classList.contains("is-open");

                document.querySelectorAll(".spef-dropdown.is-open").forEach((openGroup) => {
                    openGroup.classList.remove("is-open");
                    openGroup.querySelector(".spef-dropdown-trigger")
                        .setAttribute("aria-expanded", "false");
                });

                group.classList.toggle("is-open", willOpen);
                trigger.setAttribute("aria-expanded", String(willOpen));
            });
        });

        document.addEventListener("click", (event) => {
            if (!event.target.closest(".spef-dropdown")) {
                document.querySelectorAll(".spef-dropdown.is-open").forEach((group) => {
                    group.classList.remove("is-open");
                    group.querySelector(".spef-dropdown-trigger")
                        .setAttribute("aria-expanded", "false");
                });
            }
        });

        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape") {
                document.querySelectorAll(".spef-dropdown.is-open").forEach((group) => {
                    group.classList.remove("is-open");

                    const trigger = group.querySelector(".spef-dropdown-trigger");
                    trigger.setAttribute("aria-expanded", "false");
                    trigger.focus();
                });
            }
        });
    </script>

    <script>
        const toast = document.getElementById("signup-message");

        if (toast) {
            const message = toast.querySelector(".auth-toast-message");
            const params = new URLSearchParams(window.location.search);

            const signupErrors = {
                missing: "Complete all the fields before signing up.",
                email_invalid: "Enter a valid email address.",
                email_taken: "An account with that email already exists.",
                name_taken: "That name is already in use. Please choose another.",
                password_mismatch: "The passwords do not match.",
                gender_invalid: "Choose one of the listed options.",
                birthdate_invalid: "Enter a valid birth date.",
                birthdate_future: "The birth date cannot be in the future.",
                signup_failed: "We could not create the account. Please try again."
            };

            const errorCode = params.get("error");
            const notificationText = errorCode
                ? (signupErrors[errorCode] || "")
                : "";

            if (notificationText) {
                message.textContent = notificationText;
                toast.hidden = false;
            }

            toast.querySelector(".auth-toast-close").addEventListener("click", () => {
                toast.remove();

                const cleanUrl = new URL(window.location.href);
                cleanUrl.searchParams.delete("error");
                history.replaceState({}, "", cleanUrl);
            });
        }
    </script>
    <script src="../javascript/theme.js" defer></script>
</body>
</html>
